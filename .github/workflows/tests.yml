name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run acceptance tests against the configured real model (uses tokens)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --no-sync ruff check finn engine ingest api tests scripts
      - name: Test backend and acceptance checks
        run: uv run --no-sync pytest -m "not live" -q --junitxml=reports/backend.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: backend-python-${{ matrix.python }}
          path: reports/backend.xml
          retention-days: 7

  live:
    name: Real-model acceptance
    needs: backend
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Test real model
        env:
          FINN_RUN_LIVE_TESTS: "1"
          FINN_GLM_API_KEY: ${{ secrets.FINN_GLM_API_KEY }}
          FINN_GLM_BASE_URL: ${{ vars.FINN_GLM_BASE_URL || 'https://inference.hyde.tech/v1' }}
          FINN_GLM_MODEL: ${{ vars.FINN_GLM_MODEL || 'hyde/glm-5.3-flash' }}
        run: >-
          uv run --no-sync pytest -m live -q
          --basetemp="${{ runner.temp }}/finn-live"
          --junitxml=reports/live.xml
      - name: Save live results and fictional research responses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-model-acceptance
          path: |
            reports/live.xml
            ${{ runner.temp }}/finn-live/**/observations.json
          retention-days: 7

  frontend:
    name: Frontend / production and browser review
    runs-on: ubuntu-latest
    container: node:24-bookworm
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Check desktop, mobile and network-offline demo
        env:
          FINN_E2E_LIVE: "0"
        run: |
          npm run start > /tmp/finn-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID"' EXIT
          node -e 'const wait=async()=>{for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:3000")).ok)return}catch{} await new Promise(r=>setTimeout(r,1000))}process.exit(1)};wait()'
          npm run test:e2e
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-browser-failures
          path: web/test-results
          retention-days: 7
