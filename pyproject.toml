[project]
name = "finn-backend"
version = "0.1.0"
description = "Source-grounded investment intelligence prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "beautifulsoup4>=4.12,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: acceptance tests that call the configured real model (opt in with FINN_RUN_LIVE_TESTS=1)"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
